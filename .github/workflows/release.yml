name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches project version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG.TrimStart("v")
          [xml]$proj = Get-Content -Raw TreeDump.csproj
          $projVersion = @($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          Write-Host "Tag: $tagVersion   Project: $projVersion"
          if ($projVersion -ne $tagVersion) {
            Write-Error "Tag v$tagVersion does not match <Version> $projVersion in TreeDump.csproj"
            exit 1
          }

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $found = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($found) {
            Write-Host "Found: $($found.FullName)"
          }
          else {
            Write-Host "Inno Setup not found on runner. Installing with Chocolatey."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release notes from CHANGELOG
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          $log = Get-Content -Raw CHANGELOG.md
          $rx = "(?s)## \[" + [regex]::Escape($ver) + "\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\r?\n\[[^\]]+\]:|\z)"
          $m = [regex]::Match($log, $rx)
          if (-not $m.Success) {
            Write-Error "No CHANGELOG.md section found for version $ver"
            exit 1
          }
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n---`n`n**Downloads**`n`n"
          $notes += "- ``TreeDump-Setup-$ver.exe``: installer (recommended). Installs for the current user, no admin rights and no .NET needed.`n"
          $notes += "- ``TreeDump-Portable-$ver-win-x64.zip``: portable build. Extract anywhere you can write to and run ``TreeDump.exe``. Settings and exports stay next to the executable.`n"
          $notes += "- ``SHA256SUMS.txt``: checksums for both files.`n`n"
          $notes += "The files are not code-signed, so Windows SmartScreen may warn on first run (More info, then Run anyway). Verify the checksum if in doubt."
          Set-Content -Encoding utf8 release-notes.md $notes

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          $extra = @()
          if ($env:TAG -match '-') { $extra += "--prerelease" }
          gh release create $env:TAG @assets --title "TreeDump Pro $env:TAG" --notes-file release-notes.md --verify-tag @extra